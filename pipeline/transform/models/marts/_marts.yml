version: 2

seeds:
  - name: seed_airports
    description: Static IATA → city/country lookup, generated from src/eu_airports.json. Used by marts to denormalize origin/destination names.
    columns:
      - name: airport_iata
        tests:
          - not_null
          - unique

models:
  - name: mart_route_calendar
    description: '"Which date should I fly?" — cheapest bookable price per route/departure date, across airlines.'
    columns:
      - name: departure_date
        tests:
          - not_null
      - name: min_price_eur
        tests:
          - not_null

  - name: mart_price_by_days_to_departure_daily
    description: '"How far ahead should I book?" — average price by days-to-departure bucket, per route/weekday/airline.'
    columns:
      - name: days_bucket
        tests:
          - not_null
      - name: bucket_start
        tests:
          - not_null
      - name: avg_price_eur
        tests:
          - not_null
      - name: sample_count
        description: Observation count backing this bucket — low values mean the average is thin, not a confident trend.
        tests:
          - not_null

  - name: mart_route_historical_low
    description: All-time low price per (origin, destination), surviving beyond price-history retention.
    columns:
      - name: origin_iata
        tests:
          - not_null
      - name: destination_iata
        tests:
          - not_null
      - name: historical_low_price_eur
        tests:
          - not_null
      - name: scrape_date
        description: The date this all-time-low price was first recorded (ties broken to earliest).
        tests:
          - not_null
      - name: departure_date
        tests:
          - not_null
      - name: days_to_departure
        description: How far ahead of departure the low was captured (departure_date − scrape_date).
        tests:
          - not_null

  - name: mart_discounts
    description: '"Deals worth acting on" — flights currently priced well below their pooled route/weekday/month baseline.'
    columns:
      - name: flight_key
        tests:
          - not_null
          - unique
      - name: price_eur
        tests:
          - not_null
      - name: baseline_price_eur
        tests:
          - not_null
      - name: price_drop_ratio
        description: Fraction, not a whole-number percentage (Looker Studio percentage column type expects -1~0) — always negative by construction, e.g. -0.20 for a 20% discount.
        tests:
          - not_null
      - name: dropped_on
        tests:
          - not_null
      - name: days_at_low
        tests:
          - not_null
      - name: discount_rank
        description: Dashboard sort key — freshest-discount country pair first, that pair's freshest route first within it, route's rows contiguous. Order by this column directly.
        tests:
          - not_null

  - name: mart_pipeline_freshness
    description: One summary row for the dashboard's health strip — daily freshness/volume metrics.
    columns:
      - name: scrape_date
        tests:
          - not_null
      - name: flight_count
        tests:
          - not_null
      - name: origins_seen
        tests:
          - not_null
      - name: airline_count
        tests:
          - not_null
      - name: window_days
        tests:
          - not_null
