version: 2

models:
  - name: int_flight_price_by_days_to_departure
    description: >
      Running sum/sum_sq/count of observed prices per (origin, destination, airline,
      departure_weekday, days_bucket) — incremental, merges only the newest day's observations
      into the running totals rather than rescanning full history. mart_price_by_days_to_departure_daily
      derives avg_price_eur from these downstream.
    columns:
      - name: origin_iata
        tests:
          - not_null
      - name: destination_iata
        tests:
          - not_null
      - name: airline
        tests:
          - not_null
      - name: departure_weekday
        tests:
          - not_null
      - name: days_bucket
        tests:
          - not_null
      - name: sum_price_eur
        tests:
          - not_null
      - name: sum_sq_price_eur
        tests:
          - not_null
      - name: sample_count
        tests:
          - not_null
      - name: last_updated_run_date
        description: Guards against double-counting on an Airflow retry of the same run_date — not backfill/out-of-order-safe.
        tests:
          - not_null

  - name: int_flight_price_baseline
    description: >
      Running sum/sum_sq/count of observed prices per (origin, destination, airline,
      departure_weekday, departure_month, departure_year) — pooled across every flight_key sharing
      that route/weekday/season, not one flight_key's own (often sparse) history. Incremental;
      a post_hook drops whole departure_year buckets older than 2 years. mart_discounts derives
      avg/stddev from these to flag a price as a statistical outlier.
    columns:
      - name: origin_iata
        tests:
          - not_null
      - name: destination_iata
        tests:
          - not_null
      - name: airline
        tests:
          - not_null
      - name: departure_weekday
        tests:
          - not_null
      - name: departure_month
        tests:
          - not_null
      - name: departure_year
        tests:
          - not_null
      - name: sum_price_eur
        tests:
          - not_null
      - name: sum_sq_price_eur
        tests:
          - not_null
      - name: sample_count
        tests:
          - not_null
      - name: last_updated_run_date
        description: Guards against double-counting on an Airflow retry of the same run_date — not backfill/out-of-order-safe.
        tests:
          - not_null
